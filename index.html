<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABDO Chat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#161616;--ink:#F5F5F7;--mut:#9A9A9F;--line:#262626;--navy:#111111;--navy2:#1A1A1A;--acc:#D4AF37;--gold:#D4AF37;--sent:#C5A059;--warn:#E05A47;--dk:#1A1A1A;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;max-width:520px;margin-inline:auto;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
header{background:rgba(18,18,20,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.05);width:100%;z-index:100}
header h1{font-size:18px;margin:0;flex:1;font-weight:700}
header button{background:rgba(255,255,255,.1);border:0;color:#fff;font:inherit;cursor:pointer;padding:7px 11px;border-radius:10px}
.mark{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700}
.badge{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.auth{background:linear-gradient(160deg,#000,#120F06 60%,#2A2009);color:#fff;padding:36px 20px;justify-content:center;text-align:center;overflow:auto}
.logo{width:84px;height:84px;border-radius:26px;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;color:var(--gold);letter-spacing:2px;margin:0 auto 14px;background:rgba(255,255,255,.06)}
.auth h2{margin:0 0 4px;font-size:26px}.sub{color:#ffffffb3;margin:0;font-size:14px}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin-top:22px;text-align:start}
.lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input,select,textarea{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.phoneRow{display:flex;gap:8px;direction:ltr}.country-select{position:relative;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);flex:none;font-size:15px;color:var(--ink)}
.country-select svg{color:var(--mut)}
.country-select select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.country-select:focus-within{outline:3px solid var(--acc);outline-offset:2px}
#v-phone{position:relative;padding-top:76px}
.top-nav{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.nav-title{font-size:15px;font-weight:700;color:var(--gold)}
.nav-actions{min-width:40px;display:flex;justify-content:flex-end}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;font:inherit;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hint span{color:var(--gold);font-weight:700;letter-spacing:2px}.phoneRow input{text-align:left}
#otp{text-align:center;direction:ltr;letter-spacing:8px;font-size:22px}
.btn{font:inherit;font-weight:700;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--dk);font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}.btn.sm{width:auto;margin:0;padding:7px 12px;font-size:13px;border-radius:9px}.btn.red{background:var(--warn);color:#fff}.btn.gh{background:#222;color:var(--ink)}
.link{background:none;border:0;color:#ffffffb3;font:inherit;margin-top:18px;cursor:pointer;text-decoration:underline}
.hint{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.8;text-align:center}
.err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
.list{overflow:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;padding:13px 16px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;border:1px solid #3a3320;background:linear-gradient(135deg,#242424,#111);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.sys{background:linear-gradient(135deg,#D4AF37,#8A6D1F);color:var(--dk)}.unread{min-width:21px;height:21px;border-radius:99px;background:var(--acc);color:var(--dk);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px;background:radial-gradient(circle at 18% 8%,rgba(212,175,55,.16),transparent 45%),radial-gradient(circle at 88% 82%,rgba(197,160,89,.10),transparent 50%),#0A0A0A}
.m{max-width:75%;padding:12px 16px;margin:2px 0;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);align-self:flex-start;border-radius:20px;border-end-start-radius:4px;border:1px solid rgba(255,255,255,.04);font-size:15px;line-height:1.6;word-break:break-word}
.m.me{align-self:flex-end;background:var(--sent);color:var(--dk);border-color:transparent;border-radius:20px;border-end-end-radius:4px;box-shadow:0 4px 15px rgba(197,160,89,.15);font-weight:500}
.m i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}.m.me i{color:#1A1A1Ab3;font-weight:400}
.compose{display:flex;gap:8px;padding:10px;background:rgba(18,18,20,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.05)}
.compose input{border-radius:99px;padding:11px 18px;font-size:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--ink)}
.compose input::placeholder{color:var(--mut)}
.compose button{border:0;border-radius:50%;width:46px;height:46px;background:linear-gradient(135deg,#D4AF37,#B8923A);color:var(--dk);cursor:pointer;flex:none;display:grid;place-items:center;box-shadow:0 4px 14px rgba(212,175,55,.35)}.compose button svg{transform:scaleX(-1)}
.tabs{display:flex;background:rgba(18,18,20,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.05)}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.tabs button span{font-size:19px}.tabs button.on{color:var(--acc);font-weight:700}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 6px;direction:ltr}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}.dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:18px;direction:ltr}
.pad button{height:72px;border-radius:50%;border:1px solid #ffffff30;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:24px;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.22)}
#pinErr{color:#FF9C8A;min-height:20px;font-size:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.pad-in{padding:14px}
.glass-avatar{position:relative;flex:none}.glass-avatar .av{width:40px;height:40px}
.online-indicator{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:#34C759;border:2px solid #121214}
.who{flex:1;min-width:0}.who h4{margin:0;font-size:16px;font-weight:700}.status{font-size:12px;color:#34C759}
#v-chat,#v-chats,#v-admin{position:relative}
#v-chat>header,#v-chats>header,#v-admin>header{position:absolute;top:0;inset-inline:0}
#v-chat .compose,#v-chats .tabs,#v-admin .tabs{position:absolute;bottom:0;inset-inline:0;z-index:100}
#v-chat .msgs{padding:84px 14px 84px}
#v-chats .list{padding:68px 0 66px}
#v-admin .list{padding:80px 14px 80px}
.c2{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}.c2 h3{font-size:14px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:14px;border-inline-start:3px solid var(--gold)}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--acc),#8A6D1F);min-height:3px}
.lg{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.lg:last-child{border:0}.lg small{color:var(--mut);flex:none}
.urow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.urow:last-child{border:0}.urow .t{flex:1;min-width:0}.urow b{display:block;font-size:14px}.urow small{color:var(--mut);direction:ltr;display:inline-block}
.mrow{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}.mrow:last-child{border:0}.mrow .t{flex:1;min-width:0;font-size:14px;word-break:break-word}.mrow small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.bc{display:flex;gap:8px}.bc input{padding:10px}
.tog{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ===== شاشة الدخول: تنسيق الذهب الملكي ===== */
#v-phone{padding:20px;justify-content:space-between;background-color:#0B0B0D;background-image:radial-gradient(circle at 50% 90%,rgba(197,160,89,.12) 0%,transparent 60%)}
#v-phone .top-nav{position:static;padding:10px 0}
#v-phone .nav-title{font-size:16px;font-weight:600;letter-spacing:.5px;color:#fff}
#v-phone .icon-btn{width:auto;height:auto;padding:6px;background:none;border:0;border-radius:0;opacity:.8;transition:opacity .2s;backdrop-filter:none;-webkit-backdrop-filter:none}
#v-phone .icon-btn:hover{opacity:1}
#v-phone .hero-section{display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0}
#v-phone .logo{width:84px;height:84px;background:#141417;border:1.5px solid var(--gold);border-radius:22px;margin:0 0 20px;box-shadow:0 0 25px rgba(212,175,55,.15);font-size:18px;letter-spacing:1px}
#v-phone h2{font-size:24px;margin:0 0 6px;letter-spacing:.5px}
#v-phone .sub{font-size:13px;color:#8E8E93}
#v-phone .card{background:#141417;border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:20px;margin:0 0 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#v-phone .lbl{font-size:12px;color:#8E8E93;margin-bottom:8px}
#v-phone .phoneRow{gap:10px}
#v-phone .country-select,#v-phone .phoneRow input{background:#0D0D0F;border:1px solid rgba(255,255,255,.08);border-radius:12px;transition:border-color .3s}
#v-phone .country-select{padding:12px 14px;gap:8px;font-size:13px}
#v-phone .phoneRow input{padding:12px 16px;font-size:15px;text-align:right}
#v-phone .phoneRow input::placeholder{color:#4A4A4F}
#v-phone .phoneRow input:focus{border-color:var(--gold)}
#v-phone .err{margin-top:6px}
#v-phone #send{background:linear-gradient(135deg,#E5C568 0%,#C5A059 100%);color:#111;border-radius:14px;padding:14px;font-size:15px;font-weight:600;margin-top:6px;box-shadow:0 4px 15px rgba(197,160,89,.25);transition:opacity .2s,transform .1s}
#v-phone #send:hover{opacity:.92;transform:translateY(-1px)}
#v-phone .hint{font-size:11px;color:#8E8E93;margin-top:14px}
#v-phone .hint span{font-weight:600;letter-spacing:0}
@media (prefers-reduced-motion:reduce){#v-phone #send:hover{transform:none}}

/* ===== iOS Glass: شاشة الدخول (حسب الملف المرفق) ===== */
#v-phone{--gold-gradient:linear-gradient(135deg,#F3E5AB 0%,#D4AF37 50%,#AA7C11 100%);--text-muted:rgba(255,255,255,.55);
  padding:24px;overflow-x:hidden;background-color:#0C0C0F;background-image:none}
.glow-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient-glow{position:absolute;width:250px;height:250px;border-radius:50%;filter:blur(70px);opacity:.35}
.glow-1{top:-50px;left:-50px;background:rgba(212,175,55,.4)}
.glow-2{bottom:-50px;right:-50px;background:rgba(100,80,200,.3)}
#v-phone>*:not(.glow-layer){position:relative;z-index:2}
#v-phone .top-nav{position:static;padding:0}
#v-phone .nav-actions{display:flex;gap:8px}
#v-phone .nav-title{font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff}
#v-phone .icon-btn{width:36px;height:36px;padding:0;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:none;opacity:1;color:#fff;transition:all .2s ease}
#v-phone .icon-btn:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}
#v-phone .logo{width:88px;height:88px;background:rgba(20,20,25,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid var(--gold);border-radius:26px;margin:0 0 20px;box-shadow:0 10px 30px rgba(212,175,55,.25),inset 0 1px 0 rgba(255,255,255,.2)}
#v-phone .logo span{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:20px;letter-spacing:1px}
#v-phone h2{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:.4px}
#v-phone .sub{font-size:13px;color:var(--text-muted)}
#v-phone .card{background:rgba(25,25,32,.45);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.15);border-radius:28px;padding:22px;margin:0;box-shadow:0 20px 40px rgba(0,0,0,.5)}
#v-phone .lbl{font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:500}
#v-phone .country-select,#v-phone .phoneRow input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:none}
#v-phone .country-select{padding:12px 14px;gap:8px;font-size:13px;transition:background .2s}
#v-phone .country-select:hover{background:rgba(255,255,255,.09)}
#v-phone .phoneRow input{padding:12px 16px;font-size:16px;text-align:right;transition:all .3s ease}
#v-phone .phoneRow input::placeholder{color:rgba(255,255,255,.2)}
#v-phone .phoneRow input:focus{border-color:var(--gold);background:rgba(255,255,255,.08);box-shadow:0 0 15px rgba(212,175,55,.15)}
#v-phone #send{background:var(--gold-gradient);color:#111114;border:0;border-radius:16px;padding:15px;font-size:15px;font-weight:700;margin-top:10px;box-shadow:0 8px 25px rgba(212,175,55,.3);transition:all .2s ease}
#v-phone #send:hover{opacity:.95;transform:translateY(-2px);box-shadow:0 12px 30px rgba(212,175,55,.4)}
#v-phone #send:active{transform:scale(.97)}
#v-phone #send:disabled{opacity:.6;transform:none}
#v-phone .hint{font-size:11px;color:var(--text-muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){#v-phone .icon-btn:hover,#v-phone #send:hover,#v-phone #send:active{transform:none}}

function errText(e){
  const c=(e&&e.code)||'';
  if(c.includes('invalid-phone'))return 'رقم الجوال غير صحيح';
  if(c.includes('too-many'))return 'محاولات كثيرة، حاول لاحقًا';
  if(c.includes('invalid-verification'))return 'الرمز غير صحيح';
  if(c.includes('code-expired'))return 'انتهت صلاحية الرمز';
  if(e&&e.message==='load')return 'تعذّر الاتصال بالخدمة';
  return 'حدث خطأ، حاول مرة أخرى';
}

function voiceUI(m){
  const w=el('div','vn'),btn=el('button','vplay','▶'),wave=el('div','wave');
  btn.type='button';btn.setAttribute('aria-label','تشغيل');
  (m.bars||(m.bars=mkBars(26,m.d))).forEach((h,i)=>{const b=el('span');b.style.height=h+'%';b.style.animationDelay=(i%6)*70+'ms';wave.appendChild(b)});
  let timer=0,playing=false,audio=null;
  const paint=f=>{const k=Math.round(Math.min(1,f)*wave.children.length);[...wave.children].forEach((b,i)=>b.classList.toggle('on',i<k))};
  const stop=()=>{playing=false;clearInterval(timer);btn.textContent='▶';w.classList.remove('playing');if(audio)audio.pause()};
  btn.onclick=e=>{e.stopPropagation();if(playing){stop();return}
    playing=true;btn.textContent='❚❚';w.classList.add('playing');
    if(m.url){audio=audio||new Audio(m.url);audio.ontimeupdate=()=>paint(audio.currentTime/(audio.duration&&isFinite(audio.duration)?audio.duration:m.dur));audio.onended=()=>{stop();paint(0)};audio.play().catch(stop)}
    else{const t0=Date.now();timer=setInterval(()=>{const f=(Date.now()-t0)/1000/m.dur;paint(f);if(f>=1){stop();paint(0)}},80)}};
  w.append(btn,wave,el('span','vdur',fmtDur(m.dur)));return w}

function bindPress(d,m){
  let tm=0,sx=0,sy=0;
  d.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;tm=setTimeout(()=>reactMenu(d,m),480)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>d.addEventListener(ev,()=>clearTimeout(tm)));
  d.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)clearTimeout(tm)});
  d.addEventListener('contextmenu',e=>{e.preventDefault();reactMenu(d,m)})}

async function webAuthn(){
  if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('na');
  if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))throw new Error('na');
  const ch=crypto.getRandomValues(new Uint8Array(32));let id=null;
  try{id=localStorage.getItem('abdoCred')}catch(e){}
  if(id){const raw=Uint8Array.from(atob(id),c=>c.charCodeAt(0));
    await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{id:raw,type:'public-key',transports:['internal']}],userVerification:'required',timeout:60000}});return}
  const cred=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'ABDO Chat'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'abdo-user',displayName:'ABDO user'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  try{localStorage.setItem('abdoCred',btoa(String.fromCharCode(...new Uint8Array(cred.rawId))))}catch(e){}}

    recTimer=setInterval(()=>{$('txt').placeholder='● '+fmtDur((Date.now()-recT0)/1000)},400);
  }catch(e){toast('تعذّر الوصول إلى الميكروفون')}};
$('back').onclick=()=>{state.unlocked={};renderChats();show('chats')};

/* ===== بوابة المدير: مخفية — اضغط الشعار 7 مرات متتالية ===== */
let taps=0,tapT=0;
function secret(){const n=Date.now();taps=(n-tapT<2000)?taps+1:1;tapT=n;
  if(taps>=7){taps=0;pin='';drawPin();$('pinErr').textContent='';show('pin')}}
let pin='',tries=0,lockUntil=0;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const drawPin=()=>document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
['1','2','3','4','5','6','7','8','9','c','0','b'].forEach(k=>{const b=el('button',null,k==='c'?'✕':k==='b'?'⌫':k);b.type='button';b.setAttribute('aria-label',k==='c'?'إلغاء':k==='b'?'حذف':k);b.onclick=()=>pinPress(k);$('pad').appendChild(b)});
async function pinPress(k){
  const err=$('pinErr');
  if(k==='c'){pin='';drawPin();err.textContent='';show(state.me?'chats':'phone');return}
  if(k==='b'){pin=pin.slice(0,-1);drawPin();return}
  if(Date.now()<lockUntil){err.textContent='محاولات كثيرة، انتظر '+Math.ceil((lockUntil-Date.now())/1000)+' ثانية';return}
  if(pin.length>=5)return;
  pin+=k;drawPin();err.textContent='';
  if(pin.length<5)return;
  let h='';
  try{h=await sha(pin)}catch(e){err.textContent='المتصفح لا يدعم التحقق الآمن';pin='';drawPin();return}
  if(h===PIN_CUR){state.admin=true;pin='';tries=0;drawPin();state.tab='ov';addLog('دخول المدير');renderAdmin();show('admin')}
  else{tries++;pin='';drawPin();err.textContent='الرمز غير صحيح';
    const d=$('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    if(tries>=5){lockUntil=Date.now()+30000;tries=0;err.textContent='تم القفل 30 ثانية'}}}
document.addEventListener('keydown',e=>{
  if(!$('v-pin').classList.contains('on'))return;
  if(/^\d$/.test(e.key))pinPress(e.key);else if(e.key==='Backspace')pinPress('b');else if(e.key==='Escape')pinPress('c')});

/* ===== لوحة المدير ===== */
const real=()=>state.users.filter(u=>u.id!==0);
const allMsgs=()=>{const o=[];for(const k in state.msgs)state.msgs[k].forEach(m=>o.push({k:+k,m}));return o};
const card=(t)=>{const c=el('div','c2');if(t)c.appendChild(el('h3',null,t));return c};
function renderAdmin(){
  if(!state.admin){show(state.me?'chats':'phone');return}
  document.querySelectorAll('#aNav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const body=$('aBody');body.textContent='';({ov:tabOv,us:tabUs,ms:tabMs,st:tabSt})[state.tab](body)}
function tabOv(body){
  const am=allMsgs(),mid=new Date().setHours(0,0,0,0),g=el('div','stats');
  [[real().length,'المستخدمون'],[am.length,'إجمالي الرسائل'],[real().filter(u=>u.banned).length,'المحظورون'],[am.filter(x=>x.m.d>=mid).length,'رسائل اليوم']].forEach(([n,l])=>{
    const s=el('div','stat');s.append(el('b',null,String(n)),el('span',null,l));g.appendChild(s)});
  body.appendChild(g);
  const c=card('الرسائل خلال آخر 7 أيام'),ch=el('div','chart'),cnt=[];
  for(let i=6;i>=0;i--){const s=mid-i*DAY;cnt.push([s,am.filter(x=>x.m.d>=s&&x.m.d<s+DAY).length])}
  const mx=Math.max(1,...cnt.map(x=>x[1]));
  cnt.forEach(([s,n])=>{const b=el('div','bar'),bar=el('i');bar.style.height=(n/mx*80)+'%';b.append(el('span',null,String(n)),bar,el('span',null,new Date(s).toLocaleDateString('ar',{weekday:'short'})));ch.appendChild(b)});
  c.appendChild(ch);body.appendChild(c);
  const l=card('آخر النشاطات');
  if(!state.log.length)l.appendChild(el('div','lg','لا يوجد نشاط بعد'));
  state.log.slice(0,8).forEach(x=>{const r=el('div','lg');r.append(el('span',null,x.t),el('small',null,time(x.d)));l.appendChild(r)});
  body.appendChild(l)}
function tabUs(body){
  const c=card('إدارة المستخدمين'),q=el('input');q.placeholder='بحث بالاسم أو الرقم';q.value=state.q;q.setAttribute('aria-label','بحث');
  const box=el('div');box.style.marginTop='8px';c.append(q,box);body.appendChild(c);
  const fill=()=>{box.textContent='';state.q=q.value.trim();
    const list=real().filter(u=>(u.name+u.phone).includes(state.q));
    if(!list.length)box.appendChild(el('div','lg','لا نتائج'));
    list.forEach(u=>{const r=el('div','urow'),t=el('div','t'),s=el('small',null,u.phone+(u.banned?' · محظور':''));
      t.append(el('b',null,u.name),s);
      const ban=el('button','btn sm'+(u.banned?'':' red'),u.banned?'رفع الحظر':'حظر');
      ban.onclick=()=>{u.banned=!u.banned;addLog((u.banned?'حظر ':'رفع حظر ')+u.name);fill()};
      const del=el('button','btn sm gh','حذف');
      del.onclick=()=>{if(del.dataset.c){state.users=state.users.filter(x=>x!==u);delete state.msgs[u.id];addLog('حذف '+u.name);fill()}
        else{del.dataset.c=1;del.textContent='تأكيد؟';setTimeout(()=>{if(del.isConnected){del.dataset.c='';del.textContent='حذف'}},3000)}};
      const ren=el('button','btn sm gh','تعديل الاسم');ren.onclick=()=>{const n=(prompt('الاسم الجديد',u.name)||'').trim().slice(0,30);if(n){addLog('تعديل اسم '+u.name+' إلى '+n);u.name=n;fill()}};
      const pr=state.protectedIds.includes(u.id),lk=el('button','btn sm gh',pr?'إزالة القفل 🔓':'قفل المحادثة 🔒');
      lk.onclick=()=>{state.protectedIds=pr?state.protectedIds.filter(x=>x!==u.id):[...state.protectedIds,u.id];addLog((pr?'إزالة قفل ':'قفل ')+u.name);fill()};
      const ac=el('div','acts');ac.append(ban,ren,lk,del);
      r.append(el('div','av',u.name[0]),t,ac);box.appendChild(r)})};
  q.oninput=fill;fill()}
function tabMs(body){
  const c=card('إعلان لجميع المستخدمين'),row=el('div','bc'),i=el('input'),b=el('button','btn sm','إرسال');
  i.placeholder='نص الإعلان';i.maxLength=300;i.setAttribute('aria-label','نص الإعلان');
  b.onclick=()=>{const t=i.value.trim();if(!t)return;state.msgs[0].push({f:0,t:'📢 إعلان من الإدارة: '+t,d:Date.now()});addLog('إرسال إعلان');renderAdmin()};
  row.append(i,b);c.appendChild(row);body.appendChild(c);
  const l=card('سجل الرسائل (للإشراف)');
  allMsgs().sort((a,b)=>b.m.d-a.m.d).slice(0,40).forEach(({k,m})=>{
    const r=el('div','mrow'),t=el('div','t');
    t.append(el('small',null,nameOf(m.f)+' · المحادثة: '+nameOf(k)+' · '+time(m.d)),document.createTextNode(m.t));
    const x=el('button','btn sm gh','✕');x.setAttribute('aria-label','حذف الرسالة');
    x.onclick=()=>{const a=state.msgs[k],ix=a.indexOf(m);if(ix>-1)a.splice(ix,1);addLog('حذف رسالة');renderAdmin()};
    r.append(t,x);l.appendChild(r)});
  body.appendChild(l)}
function tabSt(body){
  const c=card('رسالة الترحيب'),w=el('textarea');w.rows=3;w.maxLength=200;w.value=state.welcome;w.setAttribute('aria-label','رسالة الترحيب');
  const s=el('button','btn','حفظ');
  s.onclick=()=>{const t=w.value.trim();if(!t)return;state.welcome=t;const m=state.msgs[0].find(x=>x.w);if(m)m.t=t;addLog('تعديل رسالة الترحيب');s.textContent='تم الحفظ ✓'};
  c.append(w,s);body.appendChild(c);
  const r=card('التسجيل'),tg=el('div','tog'),bt=el('button','btn sm'+(state.open?'':' red'),state.open?'مفتوح':'مغلق');
  bt.onclick=()=>{state.open=!state.open;addLog(state.open?'فتح التسجيل':'إغلاق التسجيل');renderAdmin()};
  tg.append(el('span',null,'السماح بتسجيل أرقام جديدة'),bt);r.appendChild(tg);body.appendChild(r);
  const pc=card('تغيير رمز المدير'),pi=el('input');pi.type='password';pi.inputMode='numeric';pi.maxLength=5;pi.placeholder='5 أرقام';pi.setAttribute('aria-label','الرمز الجديد');
  const pb=el('button','btn','تحديث الرمز');pb.onclick=async()=>{if(!/^\d{5}$/.test(pi.value)){toast('الرمز يجب أن يكون 5 أرقام');return}PIN_CUR=await sha(pi.value);try{localStorage.setItem('abdoPin',PIN_CUR)}catch(e){}addLog('تغيير رمز المدير');pi.value='';toast('تم تحديث الرمز')};
  pc.append(pi,pb);body.appendChild(pc);
  const dc=card('البيانات'),ex=el('button','btn gh','تصدير نسخة احتياطية (JSON)'),rs=el('button','btn red','إعادة ضبط كل البيانات');
  ex.onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([snap()],{type:'application/json'}));a.download='abdo-chat-backup.json';a.click();addLog('تصدير نسخة احتياطية')};
  rs.onclick=()=>{if(rs.dataset.c){noSave=true;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}else{rs.dataset.c=1;rs.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{rs.dataset.c='';rs.textContent='إعادة ضبط كل البيانات'},3000)}};
  dc.append(ex,rs);body.appendChild(dc);
  body.appendChild(el('div','hint','رمز المدير محفوظ كبصمة SHA-256. لحماية حقيقية انقل التحقق وصلاحيات المدير إلى السيرفر.'))}
$('aNav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;renderAdmin()}};
$('aExit').onclick=()=>{state.admin=false;if(state.me){renderChats();show('chats')}else show('phone')};

document.querySelector('#v-phone .logo').onclick=secret;document.querySelector('#v-chats .mark').onclick=secret;
document.addEventListener('click',e=>{
  if(e.target.closest('.prof')&&state.me){const n=(prompt('اسمك',state.me.name)||'').trim().slice(0,30);if(n){addLog('تغيير اسم '+state.me.name+' إلى '+n);state.me.name=n;renderChats();toast('تم حفظ الاسم')}}
  if(e.target.closest('.out')){state.admin=false;state.me=null;state.cur=null;$('phone').value='';show('phone')}});

/* ===== اللغة AR / EN ===== */
const I18N={
ar:{sub:'محادثات آمنة بأسلوب أنيق',e2e:'مشفّرة من طرف إلى طرف',phoneLbl:'رقم الجوال',send:'إرسال رمز التحقق',demo:'وضع تجريبي – رمز التحقق:',otpTitle:'رمز التحقق',otpTo:'أرسلنا رمزًا إلى',verify:'تأكيد ودخول',change:'تغيير الرقم',errPhone:'أدخل رقم جوال صحيح بدون رمز الدولة',errBanned:'هذا الحساب محظور. تواصل مع الإدارة.',errClosed:'التسجيل مغلق حاليًا.',errCode:'الرمز غير صحيح',tChats:'المحادثات',tOut:'خروج',back:'→'},
en:{sub:'Secure chats, elegantly',e2e:'End-to-End Encrypted',phoneLbl:'Phone number',send:'Send verification code',demo:'Demo mode – code:',otpTitle:'Verification code',otpTo:'We sent a code to',verify:'Verify & continue',change:'Change number',errPhone:'Enter a valid phone number without the country code',errBanned:'This account is banned. Contact support.',errClosed:'Registration is currently closed.',errCode:'Incorrect code',tChats:'Chats',tOut:'Sign out',back:'←'}};
let lang='ar';
try{if(localStorage.getItem('abdoLang')==='en')lang='en'}catch(e){}
const t=k=>I18N[lang][k];
function renderOtpTo(){$('otpTo').textContent=state.e164?t('otpTo')+' '+state.e164:''}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(n=>{n.textContent=t(n.dataset.i)});
  document.querySelectorAll('.lang-btn').forEach(b=>{b.textContent=lang==='ar'?'EN':'AR'});
  $('otpBack').textContent=t('back');
  const h=$('demoHint');h.textContent='';if(!CONFIG.firebase)h.append(t('demo')+' ',el('span',null,CONFIG.demoCode));
  $('e2e').hidden=!CONFIG.e2eBadge;renderOtpTo()}
document.querySelectorAll('.lang-btn').forEach(b=>{b.onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('abdoLang',lang)}catch(e){}applyLang()}});

/* ===== مربعات OTP ===== */
const boxes=[];
for(let i=0;i<6;i++){
  const b=el('input','otp-box');b.type='text';b.inputMode='numeric';b.maxLength=1;b.autocomplete=i===0?'one-time-code':'off';b.setAttribute('aria-label','Digit '+(i+1));
  $('otpBoxes').appendChild(b);boxes.push(b);
  b.addEventListener('focus',()=>b.select());
  b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'').slice(-1);b.classList.toggle('f',!!b.value);
    if(b.value&&i<5)boxes[i+1].focus();
    if(getOtp().length===6)$('verify').click()});
  b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i>0){boxes[i-1].value='';boxes[i-1].classList.remove('f');boxes[i-1].focus()}});
  b.addEventListener('paste',e=>{e.preventDefault();
    const d=((e.clipboardData&&e.clipboardData.getData('text'))||'').replace(/\D/g,'').slice(0,6);
    if(!d)return;d.split('').forEach((c,j)=>{boxes[j].value=c;boxes[j].classList.add('f')});
    boxes[Math.min(d.length,5)].focus();if(d.length===6)$('verify').click()});
}
function getOtp(){return boxes.map(b=>b.value).join('')}
function clearOtp(){boxes.forEach(b=>{b.value='';b.classList.remove('f')})}
function focusOtp(){setTimeout(()=>boxes[0].focus(),60)}
function shakeOtp(){const w=$('otpBoxes');clearOtp();w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');boxes[0].focus()}

/* ===== تأثير الضغط (Ripple) ===== */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');
  if(!b||b.disabled||b.classList.contains('remo')||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=el('span','ripple');
  sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  b.appendChild(sp);setTimeout(()=>sp.remove(),600)});

/* ===== الحفظ التلقائي (localStorage) ===== */
const KEY='abdoChatV1';let noSave=false;
function snap(){const o={users:state.users,msgs:{},open:state.open,welcome:state.welcome,log:state.log,stories:state.stories,protectedIds:state.protectedIds,me:state.me?state.me.id:null};
  for(const k in state.msgs)o.msgs[k]=state.msgs[k].map(m=>{const c={...m};delete c.url;return c});return JSON.stringify(o)}
function save(){if(noSave)return;try{localStorage.setItem(KEY,snap())}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||!s.users)return;
  state.users=s.users;state.msgs=s.msgs||{};if(!state.msgs[0])state.msgs[0]=[];state.open=s.open!==false;state.welcome=s.welcome||state.welcome;
  state.log=s.log||[];state.stories=s.stories||{};state.protectedIds=s.protectedIds||[];
  const u=state.users.find(x=>x.id===s.me);
  if(u&&!u.banned){state.me=u;demoDone=true;renderChats();show('chats')}}catch(e){}}
load();setInterval(save,2000);addEventListener('visibilitychange',save);addEventListener('pagehide',save);

applyLang();
</script>
